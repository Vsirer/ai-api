name: ${COMPOSE_PROJECT_NAME:-ai-api}

services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: ${CADDY_CONTAINER_NAME:-ai-api-caddy}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CADDY_DOMAINS: ${CADDY_DOMAINS:-${DOMAIN}}
    ports:
      - "${HTTP_BIND_IP:-0.0.0.0}:80:80"
      - "${HTTPS_BIND_IP:-0.0.0.0}:443:443"
      - "${HTTPS_BIND_IP:-0.0.0.0}:443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site-static:/srv/site-static:ro
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - ai-api-network

volumes:
  caddy_data:
  caddy_config:

networks:
  ai-api-network:
    name: ${COMPOSE_PROJECT_NAME:-ai-api}_ai-api-network
    driver: bridge
