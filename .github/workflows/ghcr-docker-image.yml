name: Build GHCR Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional image version tag, e.g. v2026.05.11-1"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          short_sha="$(git rev-parse --short=8 HEAD)"
          date_tag="$(date -u +'%Y%m%d')"
          version="${{ github.event.inputs.version }}"

          if [ -z "$version" ]; then
            version="v${date_tag}-${short_sha}"
          fi

          echo "$version" > VERSION
          {
            echo "repository=ghcr.io/${repo}"
            echo "version=${version}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker labels
        id: labels
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repository }}:main
            ${{ steps.meta.outputs.repository }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Deployment summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.repository }}:main" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.repository }}:sha-${{ steps.meta.outputs.short_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
